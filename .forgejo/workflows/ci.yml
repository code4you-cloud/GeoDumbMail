name: Django CI with PostgreSQL
on:
  push:
    branches: [ develop, main, develop-setup-tests ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    container: ubuntu:22.04   # Ambiente standard e riproducibile

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_geodumb
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. Installa Git (necessario per il clone, ma in ubuntu:22.04 non è preinstallato)
      - name: Install system dependencies
        run: apt-get update && apt-get install -y git

      # 2. Clona il repository ignorando i submodule problematici
      - name: Clone repository (without submodules)
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://forgejo.code4you.cloud/orfeo/GeoDumbMail.git .
          rm -f .gitmodules   # Rimuove il file che causa l'errore del submodule
        env:
          # Se il repository è pubblico, rimuovi la seguente riga.
          # Se è privato, crea un secret chiamato PAT con un token valido.
          GIT_ASKPASS: echo ${{ secrets.PAT }}

      # 3. Setup Python (l'azione setup-python funziona correttamente su ubuntu:22.04)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Cache di Poetry (riduce i tempi di installazione)
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # 5. Installa Poetry
      - name: Install Poetry
        run: pip install poetry

      # 6. Installa le dipendenze del progetto
      - name: Install dependencies
        run: poetry install --no-interaction

      # 7. Esegue le migrazioni del database di test
      - name: Run migrations
        run: poetry run python manage.py migrate
        env:
          DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/test_geodumb

      # 8. Esegue i test con pytest
      - name: Run tests
        run: poetry run pytest --ignore=test_mail.py -v
        env:
          DATABASE_URL: postgresql://test_user:test_pass@postgres:5432/test_geodumb
          CI: true
