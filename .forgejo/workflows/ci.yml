name: Django CI with PostgreSQL
env:                                  # <--- QUI (globale per tutti i job)
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
on:
  push:
    branches: [ develop, main, develop-setup-tests ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_geodumb
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false   # evita di inizializzare i submodule
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run migrations
        run: poetry run python manage.py migrate
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_geodumb
      - name: Run tests
        run: poetry run pytest --ignore=test_mail.py -v
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_geodumb
          CI: true
