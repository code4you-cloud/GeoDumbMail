name: Django CI with PostgreSQL
env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
on:
  push:
    branches: [ develop, main, develop-setup-tests ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_geodumb
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Clone repository (without submodules)
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://forgejo.code4you.cloud/orfeo/GeoDumbMail.git .
          rm -f .gitmodules
        env:
          GIT_ASKPASS: echo ${{ secrets.PAT }}   # se repo privato, altrimenti rimuovi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run migrations
        run: poetry run python manage.py migrate
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_geodumb

      - name: Run tests
        run: poetry run pytest --ignore=test_mail.py -v
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_geodumb
          CI: true
